name: Quality Gates (CI/CD)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Unit, and E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Run Type Checker (TypeScript)
        run: pnpm exec tsc --noEmit

      - name: Run Production Build (Vite)
        run: pnpm run build

      - name: Run Unit Tests (Vitest)
        run: pnpm exec vitest run
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Playwright)
        run: npx playwright test
        env:
          CI: true

  deploy:
    name: Trigger Cloudflare Production Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        run: |
          echo "🚀 Triggering Cloudflare Pages deployment..."
          curl -X POST ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          echo "✅ Deploy hook triggered successfully!"
