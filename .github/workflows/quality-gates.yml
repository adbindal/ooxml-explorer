name: Quality Gates (CI/CD)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Unit, and E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npx vitest run

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Playwright)
        run: npx playwright test
        env:
          CI: true

  deploy:
    name: Trigger Cloudflare Production Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        run: |
          echo "🚀 Triggering Cloudflare Pages deployment..."
          curl -X POST ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          echo "✅ Deploy hook triggered successfully!"
